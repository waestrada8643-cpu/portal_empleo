services:
  - type: web
    name: portal-empleo
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: APP_NAME
        value: Portal Empleo
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        value: ""
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: portal-empleo-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: portal-empleo-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: portal-empleo-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: portal-empleo-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: portal-empleo-db
          property: password
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: public
      - key: MAIL_MAILER
        value: log

databases:
  - name: portal-empleo-db
    databaseName: portal_empleo
    user: portal_empleo
    plan: free
